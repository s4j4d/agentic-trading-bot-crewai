market_scout_task:
  description: >
    Scan the cryptocurrency market and produce a ranked shortlist of 3 coins
    that represent strong short-term trading opportunities right now.

    The primary objective is HIGH, TRADABLE SHORT-TERM VOLATILITY combined
    with sufficient liquidity. Do not treat a large 24-hour percentage gain
    as equivalent to volatility.

    Call each required tool at most once unless a call fails.
    Emit the five independent scouting tool calls (trending_coins,
    momentum_screener, volatility_screener, new_listings, exchange_markets)
    in a SINGLE response — they have no dependencies on each other and
    will be executed concurrently. Do not chain them one per turn.
    If a tool call errors or returns nothing usable, retry it once with
    default arguments before moving on.
    After collecting the results, analyze the existing observations.
    Do not repeat successful tool calls.

    A tool call is never a valid final answer. After the tool results are
    in, you MUST write out the final JSON object described below as plain
    text — do not finish with a function/tool call. If you are running out
    of steps, skip remaining tool calls and write the JSON from whatever
    data you already have.

    Run all seven scouting tools — the four CoinGecko screeners plus the
    three exchange tools:

    0. exchange_markets (quote_currency="usdt", only_active=true, max_results=50)
       Returns only a total_count plus a small sample — use it SOLELY to check
       whether a candidate is tradeable. Do NOT analyse the sample list.
       Confirm each finalist with exchange_ticker.

       IMPORTANT: every candidate from EVERY other tool result
       (trending_coins, momentum_screener, volatility_screener,
       new_listings, upcoming_catalysts) must be cross-checked against
       this exchange market list. A coin that is not listed/active on
       the exchange's active quote pair is NOT tradable: drop it from
       the candidate pool entirely, regardless of its
       volatility/momentum/attention score. The final shortlist must
       contain only coins whose symbol appears in exchange_markets.

    1. trending_coins (top_n=5)
       Identify coins receiving unusually high market attention.
       Use this as an attention signal, not as a volatility measurement.

    2. momentum_screener
       (top_n=10, min_volume_usd=5000000, max_market_cap_rank=500)
       Identify liquid coins with strong recent momentum across multiple
       timeframes. Use this for momentum and volume, not as the primary
       volatility measurement.

    3. volatility_screener
       (top_n=10, min_volume_usd=1000000, max_market_cap_rank=500)
       This is the PRIMARY volatility source.
       Prioritize:
       - recent realized volatility
       - maximum rolling 24h range
       - frequency of significant hourly price movements
       - sufficient trading volume

    4. new_listings (top_n=10)
       Identify newer market entries that may experience elevated volatility
       and active price discovery. Require adequate liquidity before selection.
       Do not assume id ordering is an exact listing-date ranking.

    5. exchange_batch_ticker (one call with all top candidate symbols)
       Confirm live price and 24h change on the exchange for your leading
       candidates in one concurrent call. Drop candidates with no exchange
       ticker (they will have an error field in the result).

    6. exchange_ohlc (symbol, timeframe="1d", days=30, top candidates only)
       Use recent exchange candles to confirm tradable volatility before
       final ranking. Note: the downstream analysis and execution trade on
       1-hour candles with a max hold of {max_hold_days} day(s), so prefer
       coins with frequent significant hourly movements, not just multi-day
       trends.

    Evaluate candidates using:

    - Tradable volatility: 40%
    - Liquidity and volume: 25%
    - Momentum: 15%
    - Market attention: 10%
    - Catalysts: 10%

    For volatility, prioritize actual volatility measurements from
    volatility_screener over simple 24h percentage change.

    Use:
    - recent_realized_volatility_24h_pct
    - realized_volatility_7d_pct
    - max_rolling_24h_range_pct
    - movement_frequency_pct

    A coin that moves +8%, -7%, +6%, -5% during the day can be highly
    volatile even if its final 24h change is close to zero.

    Conversely, a coin that steadily gains 30% with little intraday movement
    should not automatically receive a high volatility score.

    Exclude:
    - volume below $1M in 24h
    - missing live price
    - confirmed rug pull or exit scam
    - trading halted or effectively untradeable
    - severe exploit that compromises safe trading
    - confirmed delisting that materially destroys liquidity
    - stablecoins
    - wrapped assets

    Do NOT exclude a candidate solely because:
    - its 24h gain is above 30% or 50%
    - it has high volatility
    - it has a large recent price move
    - it has bearish news
    - it has a lawsuit, regulatory issue, hack, or exploit

    Instead, treat those events as risk factors unless they make the asset
    unsafe or effectively untradeable.

    Prefer candidates with:
    - high realized volatility
    - large rolling intraday ranges
    - frequent significant price movements
    - strong 24h volume
    - sufficient liquidity
    - meaningful momentum
    - current market attention
    - a plausible catalyst when available

    Do not favor a coin merely because it has the largest 24h gain.

    Tool output is NEVER your answer: intermediate tool results (especially
    exchange_markets samples) are working data only. Your ONLY valid final
    output is the JSON object below — never a question, summary, or
    explanation. If any tool errors, skip it and continue with the rest.

    Return exactly 3 candidates. Rank them by overall opportunity score.

  expected_output: >
    A JSON object and nothing else, with a single key "opportunities"
    containing the ranked array.

    Each object must have exactly:
    {
      "rank": 1,
      "coin_id": "<coingecko_slug>",
      "symbol": "<UPPERCASE_TICKER>",
      "name": "<full name>",
      "score": <0-100 integer>,
      "signals": ["<signal_1>"],
      "risk_tier": "<LOW|MEDIUM|HIGH|EXTREME>",
      "reason": "<one sentence>"
    }

    coin_id must be the exact CoinGecko slug.

    Sort opportunities by score descending.

    Do not call file-writing tools.
    Return JSON only.

  agent: market_scout