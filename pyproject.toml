[project]
name = "crypto_council_flow"
version = "0.1.0"
description = "crypto_council_flow using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.19,<2.0.0"
]

[project.scripts]
kickoff = "crypto_council_flow.main:kickoff"
run_crew = "crypto_council_flow.main:kickoff"
plot = "crypto_council_flow.main:plot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
project_id = "2979911b-3dac-4ddf-8065-4919651178e8"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "pytest-mock==3.14.0",
    "requests-mock==1.12.1",
]
